<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Luisa Cela 1301</title>
  <meta name="description" content="Luisa Cela 1301">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: #fff; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .site {
      position: relative;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      line-height: 0;
      overflow: hidden;
    }
    .site picture,
    .site img {
      display: block;
      width: 100%;
      height: auto;
    }
    .hotspot {
      position: absolute;
      display: block;
      z-index: 10;
      cursor: pointer;
      border-radius: 8px;
    }
    .hotspot:focus-visible {
      outline: 4px solid #fff;
      outline-offset: 3px;
    }
    .apoie {
      left: 64.4%;
      top: 17.1%;
      width: 14.9%;
      height: 6.6%;
    }
    .material {
      left: 81.0%;
      top: 15.5%;
      width: 15.8%;
      height: 7.2%;
    }
  </style>
</head>
<body>
  <main class="site">
    <picture>
      <source srcset="assets/site-luisa.webp" type="image/webp">
      <img src="assets/site-luisa.jpg" alt="Site da campanha Luisa Cela 1301" width="1920" height="3744">
    </picture>

    <a class="hotspot apoie"
       href="https://queroapoiar.com.br/luisacela"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Apoie nossa campanha"></a>

    <a class="hotspot material"
       href="https://drive.google.com/open?id=16SmHWnxXPgsi4ij5GoGuI4YneVEbyZQ8&usp=drive_fs"

       rel="noopener noreferrer"
       aria-label="Baixe nosso material de campanha"></a>

</html>
