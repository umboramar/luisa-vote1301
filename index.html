<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ef252a">
  <meta name="description" content="Luisa Cela 1301. Federal é ela.">
  <title>Luisa Cela 1301 | Federal é ela</title>
  <link rel="preload" as="image" href="assets/site-luisa.webp" type="image/webp">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #ef252a; }
    body { font-family: Arial, Helvetica, sans-serif; }
    .site { width: 100%; overflow: hidden; }
    .artboard {
      position: relative;
      width: 100%;
      max-width: 1920px;
      margin: 0 auto;
      line-height: 0;
      background: #ef252a;
    }
    .artboard picture,
    .artboard img {
      display: block;
      width: 100%;
      height: auto;
    }

    /*
      Hotspots invisiveis sobre a arte.
      As coordenadas abaixo foram recalibradas a partir das areas azuis
      indicadas na captura enviada pelo usuario.
    */
    .hotspot {
      position: absolute;
      display: block;
      z-index: 10;
      text-decoration: none;
      cursor: pointer;
      background: transparent;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .hotspot:hover,
    .hotspot:focus,
    .hotspot:focus-visible,
    .hotspot:active {
      outline: none;
      box-shadow: none;
      background: transparent;
    }

    /* 1. Faca parte do grupo de WhatsApp */
    .hotspot-whatsapp {
      left: 53.762%;
      top: 21.450%;
      width: 11.794%;
      height: 4.833%;
      clip-path: polygon(99.27% 0%, 0% 26.03%, 1.09% 100%, 100% 74.43%);
    }

    /* 2. Apoie nossa campanha */
    .hotspot-apoio {
      left: 69.817%;
      top: 20.016%;
      width: 11.880%;
      height: 4.833%;
      clip-path: polygon(98.91% 0%, 0% 26.03%, 1.45% 100%, 100% 73.97%);
    }

    /* 3. Baixe nosso material de campanha */
    .hotspot-material {
      left: 84.452%;
      top: 18.515%;
      width: 11.880%;
      height: 4.833%;
      clip-path: polygon(98.55% 0%, 0% 26.03%, 1.45% 100%, 100% 73.97%);
    }

    /* 4. YouTube: box amarelo inteiro + chamada de texto a direita */
    .hotspot-youtube {
      left: 55.570%;
      top: 24.032%;
      width: 39.300%;
      height: 13.650%;
      clip-path: polygon(
        93.9% 0%,
        0% 29.3%,
        0.7% 87.0%,
        77.8% 64.5%,
        78.0% 70.5%,
        100% 70.5%,
        100% 100%,
        78.0% 100%,
        78.0% 78.0%,
        100% 71.5%,
        100% 58.8%
      );
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <main class="site" aria-label="Site da campanha Luisa Cela 1301">
    <section class="artboard" aria-label="Luisa Cela 1301. Federal e ela.">
      <picture>
        <source srcset="assets/site-luisa.webp" type="image/webp">
        <img src="assets/site-luisa.jpg" width="1920" height="3745" alt="Landing page da campanha Luisa Cela 1301, com apresentacao da trajetoria, propostas e formas de participar.">
      </picture>

      <a
        class="hotspot hotspot-whatsapp"
        href="https://chat.whatsapp.com/CPQ7WsrkH1DGuOFpBEhbXJ?mode=gi_t"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Faca parte do nosso grupo de WhatsApp">
        <span class="sr-only">Faca parte do nosso grupo de WhatsApp</span>
      </a>

      <a
        class="hotspot hotspot-apoio"
        href="https://queroapoiar.com.br/luisacela"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Apoie nossa campanha">
        <span class="sr-only">Apoie nossa campanha</span>
      </a>

      <a
        class="hotspot hotspot-material"
        href="https://drive.google.com/drive/folders/16SmHWnxXPgsi4ij5GoGuI4YneVEbyZQ8"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Baixe nosso material de campanha">
        <span class="sr-only">Baixe nosso material de campanha</span>
      </a>

      <a
        class="hotspot hotspot-youtube"
        href="https://www.youtube.com/@luisacelaoficial"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Acesse nosso canal do YouTube">
        <span class="sr-only">Acesse nosso canal do YouTube</span>
      </a>
    </section>
  </main>
</body>
</html>
