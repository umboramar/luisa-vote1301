<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ef252a">
  <meta name="description" content="Luisa Cela. Vencemos, mas a luta continua para reeleger Lula presidente.">
  <meta name="color-scheme" content="light only">
  <title>Luisa Cela | A luta continua</title>
  <link rel="canonical" href="https://www.luisacela.com.br/">
  <link rel="icon" href="/favicon.ico?v=20261019" type="image/x-icon" sizes="any">
  <link rel="shortcut icon" href="/favicon.ico?v=20261019" type="image/x-icon">
  <link rel="icon" href="/favicon.png?v=20261019" type="image/png">
  <link rel="apple-touch-icon" href="/favicon.png?v=20261019">
  <style>
    :root { color-scheme: light; --red:#ef252a; }
    * { box-sizing: border-box; }
    html, body { margin:0; padding:0; width:100%; min-height:100%; background:var(--red); }
    body { overflow-x:hidden; font-family:Arial, Helvetica, sans-serif; }
    .site { width:100%; margin:0; background:var(--red); }
    .view { position:relative; width:100%; margin:0 auto; line-height:0; overflow:hidden; }
    .view picture, .view img { display:block; width:100%; height:auto; margin:0; padding:0; user-select:none; -webkit-user-drag:none; }
    .desktop-view { display:block; max-width:1920px; }
    .mobile-view { display:none; max-width:760px; }
    .hotspots { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
    .hotspots a { pointer-events:all; cursor:pointer; outline:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
    .hotspots .hit { fill:transparent; stroke:transparent; pointer-events:all; }
    .hotspots a:focus-visible .hit { stroke:#fff; stroke-width:8; fill:transparent; }
    @media (max-width:767px){ .desktop-view{display:none}.mobile-view{display:block} }
    @media (min-width:768px){ .desktop-view{display:block}.mobile-view{display:none} }
  </style>
</head>
<body>
  <main class="site" aria-label="Site oficial de Luisa Cela">

    <section class="view desktop-view" aria-label="Versão desktop do site">
      <picture>
        <source type="image/webp" srcset="assets/desktop-r03-1280.webp 1280w, assets/desktop-r03-1920.webp 1920w" sizes="(min-width:1920px) 1920px, 100vw">
        <img src="assets/desktop-r03-3840.jpg" width="3840" height="6300" alt="Luisa Cela e Lula. Vencemos, mas a luta continua para reeleger Lula presidente." fetchpriority="high" decoding="async">
      </picture>

      <svg class="hotspots" viewBox="0 0 3840 6300" preserveAspectRatio="none" aria-label="Links da campanha na versão desktop">
        <!-- 1. GRUPO DO WHATSAPP -->
        <a href="https://chat.whatsapp.com/CPQ7WsrkH1DGuOFpBEhbXJ?mode=gi_t" target="_blank" rel="noopener noreferrer" aria-label="Faça parte do nosso grupo no WhatsApp">
          <rect class="hit" x="2220" y="1170" width="1320" height="820" rx="40"></rect>
        </a>

        <!-- 2. VÍDEO A LUTA CONTINUA -->
        <a href="https://drive.google.com/file/d/1ANgnYnqyqHZyLz1hzP0ppt5ZiYMQ9iW1/view" target="_blank" rel="noopener noreferrer" aria-label="Assista ao vídeo A luta continua">
          <rect class="hit" x="2070" y="2010" width="1320" height="800" rx="40"></rect>
        </a>

        <!-- 3. QUERO APOIAR A CAMPANHA DO LULA -->
        <a href="https://docs.google.com/forms/d/1tj3fRow7f6g_9etI_BvGTKsArOyaplQ4L4tYq7gUL4o/viewform?hl=pt-br&amp;pli=1&amp;edit_requested=true" target="_blank" rel="noopener noreferrer" aria-label="Quero apoiar a campanha do Lula">
          <rect class="hit" x="1030" y="4240" width="1830" height="930" rx="40"></rect>
        </a>
      </svg>
    </section>

    <section class="view mobile-view" aria-label="Versão mobile do site">
      <picture>
        <source type="image/webp" srcset="assets/mobile-r03-380.webp 380w, assets/mobile-r03-760.jpg 760w" sizes="100vw">
        <img src="assets/mobile-r03-760.jpg" width="760" height="6680" alt="Luisa Cela e Lula. Vencemos, mas a luta continua para reeleger Lula presidente." fetchpriority="high" decoding="async">
      </picture>

      <svg class="hotspots" viewBox="0 0 760 6680" preserveAspectRatio="none" aria-label="Links da campanha na versão mobile">
        <!-- 1. GRUPO DO WHATSAPP -->
        <a href="https://chat.whatsapp.com/CPQ7WsrkH1DGuOFpBEhbXJ?mode=gi_t" target="_blank" rel="noopener noreferrer" aria-label="Faça parte do nosso grupo no WhatsApp">
          <rect class="hit" x="85" y="760" width="590" height="620" rx="24"></rect>
        </a>

        <!-- 2. VÍDEO A LUTA CONTINUA: no layout mobile, o clique fica sobre o título A LUTA CONTINUA -->
        <a href="https://drive.google.com/file/d/1ANgnYnqyqHZyLz1hzP0ppt5ZiYMQ9iW1/view" target="_blank" rel="noopener noreferrer" aria-label="Assista ao vídeo A luta continua">
          <rect class="hit" x="78" y="1390" width="560" height="610" rx="24"></rect>
        </a>

        <!-- 3. QUERO APOIAR A CAMPANHA DO LULA -->
        <a href="https://docs.google.com/forms/d/1tj3fRow7f6g_9etI_BvGTKsArOyaplQ4L4tYq7gUL4o/viewform?hl=pt-br&amp;pli=1&amp;edit_requested=true" target="_blank" rel="noopener noreferrer" aria-label="Quero apoiar a campanha do Lula">
          <rect class="hit" x="70" y="5200" width="610" height="520" rx="24"></rect>
        </a>
      </svg>
    </section>

  </main>
</body>
</html>
