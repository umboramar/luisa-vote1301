  >

  <link

  <link

  <style>

    :root {
      color-scheme: light;
      --vermelho: #ef252a;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;

      width: 100%;
      min-height: 100%;

      background: var(--vermelho);
    }

    body {
      overflow-x: hidden;

      font-family:
        Arial,
        Helvetica,
        sans-serif;
    }


    /* =========================
       SITE
       ========================= */

    .site {
      width: 100%;
      margin: 0 auto;

      background: var(--vermelho);
    }


    .layout {
      position: relative;

      width: 100%;
      margin: 0 auto;

      line-height: 0;

      overflow: hidden;
    }


    /* Desktop */

    .desktop-layout {
      display: block;

      max-width: 1920px;
    }


    /* Mobile */

    .mobile-layout {
      display: none;

      max-width: 760px;
    }



    /* =========================
       PDF CANVAS
       ========================= */

    .pdf-canvas {
      display: block;

      width: 100%;
      height: auto;

      margin: 0;
      padding: 0;

      background: var(--vermelho);
    }



    /* =========================
       ÁREAS CLICÁVEIS
       ========================= */

    .hotspot {
      position: absolute;

      z-index: 20;

      display: block;

      cursor: pointer;

      background: transparent;

      text-decoration: none;

      -webkit-tap-highlight-color: transparent;

      touch-action: manipulation;

      border-radius: 8px;
    }


    /*
      Apenas para acessibilidade.
      Não muda visual do layout.
    */

    .hotspot:focus-visible {
      outline: 3px solid #ffffff;
      outline-offset: 4px;
    }



    /* ==========================================================
       DESKTOP
       Página 1 do PDF
       ========================================================== */


    /* 01 - WHATSAPP */

    .desktop-whatsapp {

      left: 57.0%;
      top: 19.0%;

      width: 31.5%;
      height: 11.8%;

    }


    /* 02 - VÍDEO A LUTA CONTINUA */

    .desktop-video {

      left: 53.5%;
      top: 31.0%;

      width: 33.0%;
      height: 14.0%;

    }


    /* 03 - APOIAR CAMPANHA DO LULA */

    .desktop-apoio {

      left: 27.5%;
      top: 66.0%;

      width: 45.0%;
      height: 15.0%;

    }



    /* ==========================================================
       MOBILE
       Página 2 do PDF
       ========================================================== */


    /* 01 - WHATSAPP */

    .mobile-whatsapp {

      left: 16%;
      top: 8%;

      width: 70%;
      height: 10%;

    }


    /* 02 - VÍDEO A LUTA CONTINUA */

    .mobile-video {

      left: 16%;
      top: 18%;

      width: 70%;
      height: 9%;

    }


    /* 03 - APOIAR CAMPANHA DO LULA */

    .mobile-apoio {

      left: 14%;
      top: 78%;

      width: 72%;
      height: 10%;

    }



    /* =========================
       BREAKPOINT
       ========================= */

    @media (max-width: 767px) {

      .desktop-layout {
        display: none;
      }

      .mobile-layout {
        display: block;
      }

    }


    @media (min-width: 768px) {

      .desktop-layout {
        display: block;
      }

      .mobile-layout {
        display: none;
      }

    }


  </style>

</head>


<body>

  <main
    class="site"
    aria-label="Site oficial de Luisa Cela"

    <!-- ========================================================

         PDF PÁGINA 1
         ======================================================== -->

      <canvas

      ></canvas>


      <!-- 01 WHATSAPP -->

      <a

        rel="noopener noreferrer"

      <!-- 02 A LUTA CONTINUA -->

        target="_blank"
        rel="noopener noreferrer"
        aria-label="Assista ao vídeo A luta continua"
      ></a>


      <!-- 03 QUERO APOIAR A CAMPANHA DO LULA -->

      <a

    <!-- ========================================================
         MOBILE
         PDF PÁGINA 2
         ======================================================== -->

    <section
      class="layout mobile-layout"
      id="mobileLayout"
      aria-label="Versão mobile do site"
    >

      <canvas
        id="mobileCanvas"
        class="pdf-canvas"
        aria-label="Layout mobile Luisa Cela"
      ></canvas>


      <!-- 01 WHATSAPP -->

      <a
        class="hotspot mobile-whatsapp"
        href="https://chat.whatsapp.com/CPQ7WsrkH1DGuOFpBEhbXJ?mode=gi_t"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Faça parte do nosso grupo no WhatsApp"
      ></a>


      <!-- 02 A LUTA CONTINUA -->

      <a
        class="hotspot mobile-video"
        href="https://drive.google.com/file/d/1ANgnYnqyqHZyLz1hzP0ppt5ZiYMQ9iW1/view"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Assista ao vídeo A luta continua"
      ></a>


      <!-- 03 QUERO APOIAR A CAMPANHA DO LULA -->

      <a
        class="hotspot mobile-apoio"
        href="https://docs.google.com/forms/d/1tj3fRow7f6g_9etI_BvGTKsArOyaplQ4L4tYq7gUL4o/viewform?hl=pt-br&amp;pli=1&amp;edit_requested=true"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Quero apoiar a campanha do Lula"
      ></a>

    </section>


  </main>



  <!-- ==========================================================
       PDF.JS

       Renderiza:
       página 1 = desktop
       página 2 = mobile
       ========================================================== -->

  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs"
    type="module"
  ></script>


  <script type="module">

    import * as pdfjsLib
      from "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.min.mjs";


    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.8.69/pdf.worker.min.mjs";


    const PDF_URL =
      "./assets/site-luisa-r03.pdf";


    let pdfDocument = null;


    async function loadPDF() {

      pdfDocument =
        await pdfjsLib
          .getDocument(PDF_URL)
          .promise;

      await renderDesktop();

      await renderMobile();

    }



    async function renderPage(
      pageNumber,
      canvas,
      container
    ) {

      if (!pdfDocument) return;


      const page =
        await pdfDocument
          .getPage(pageNumber);


      /*
        viewport inicial para descobrir
        proporção real da página
      */

      const baseViewport =
        page.getViewport({
          scale: 1
        });


      const cssWidth =
        container.clientWidth;


      /*
        Usa pixel ratio para manter
        a arte nítida em Retina/iPhone.
      */

      const pixelRatio =
        Math.min(
          window.devicePixelRatio || 1,
          2
        );


      const scale =
        (
          cssWidth /
          baseViewport.width
        ) *
        pixelRatio;


      const viewport =
        page.getViewport({
          scale
        });


      canvas.width =
        Math.floor(
          viewport.width
        );


      canvas.height =
        Math.floor(
          viewport.height
        );


      /*
        CSS mantém tamanho correto
        independentemente da resolução.
      */

      canvas.style.width =
        cssWidth + "px";


      canvas.style.height =
        (
          viewport.height /
          pixelRatio
        ) + "px";


      const context =
        canvas.getContext(
          "2d",
          {
            alpha: false
          }
        );


      await page.render({

        canvasContext:
          context,

        viewport:
          viewport

      }).promise;

    }



    async function renderDesktop() {

      const canvas =
        document.getElementById(
          "desktopCanvas"
        );


      const container =
        document.getElementById(
          "desktopLayout"
        );


      await renderPage(
        1,
        canvas,
        container
      );

    }



    async function renderMobile() {

      const canvas =
        document.getElementById(
          "mobileCanvas"
        );


      const container =
        document.getElementById(
          "mobileLayout"
        );


      await renderPage(
        2,
        canvas,
        container
      );

    }



    /*
      Recalibra automaticamente
      quando muda largura/orientação.
    */

    let resizeTimer;


    window.addEventListener(
      "resize",
      () => {

        clearTimeout(
          resizeTimer
        );


        resizeTimer =
          setTimeout(
            async () => {

              if (
                window.innerWidth
                >= 768
              ) {

                await renderDesktop();

              }

              else {

                await renderMobile();

              }

            },
            180
          );

      }
    );



    /*
      Inicialização
    */

    loadPDF().catch(
      error => {

        console.error(
          "Erro ao carregar o layout:",
          error
        );

      }
    );

  </script>


</body>

</html>
