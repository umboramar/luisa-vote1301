  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ef252a;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    .page {
      position: relative;
      width: 100%;
      margin: 0;
    }

    .view {
      position: relative;
      width: 100%;
      margin: 0 auto;
      line-height: 0;
      overflow: hidden;
    }

    .view picture,
    .view picture img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-drag: none;
    }

    .desktop-view {
      display: block;
      max-width: 1920px;
    }

    .mobile-view {
      display: none;
      max-width: 767px;
    }

    /* BOTÕES DO TOPO - mantidos no mesmo local e com o mesmo visual */
    .quick-links {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 50;
      width: max-content;
      max-width: calc(100% - 24px);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      line-height: normal;
    }

    .quick-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 10px 16px;
      background: rgba(255, 255, 255, 0.12);
      border: 2px solid rgba(255, 255, 255, 0.95);
      border-radius: 999px;
      color: #ffffff;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15.4px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0.01em;
      text-align: center;
      text-decoration: none;
      white-space: nowrap;
      cursor: pointer;
      backdrop-filter: blur(1.5px);
      -webkit-backdrop-filter: blur(1.5px);
      transition: background 0.15s ease, transform 0.15s ease;
    }

    .quick-links a:hover {
      background: rgba(255, 255, 255, 0.22);
      transform: translateY(-1px);
    }

    .quick-links a:focus-visible {
      outline: 2px solid rgba(255, 255, 255, 0.95);
      outline-offset: 2px;
    }

    /* HOTSPOTS - coordenadas mantidas; apenas o canvas foi expandido para baixo */
    .hotspots {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      overflow: visible;
    }

    .hotspots a {
      pointer-events: all;
      cursor: pointer;
      outline: none;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .hotspots .hit {
      fill: transparent;
      stroke: transparent;
      pointer-events: all;
    }

    .hotspots a:hover .hit,
    .hotspots a:focus .hit,
    .hotspots a:focus-visible .hit,
    .hotspots a:active .hit {
      fill: transparent;
      stroke: transparent;
      outline: none;
    }

    @media (max-width: 767px) {
      .desktop-view { display: none; }
      .mobile-view { display: block; }

      .quick-links {
        top: 10px;
        left: 50%;
        right: auto;
        transform: translateX(-50%);
        width: calc(100% - 12px);
        max-width: none;
        justify-content: center;
        gap: 6px;
      }

      .quick-links a {
        min-height: 40px;
        padding: 8px 12px;
        font-size: 13.4px;
        border-width: 1.5px;
      }
    }

    @media (min-width: 768px) {
      .desktop-view { display: block; }
      .mobile-view { display: none; }
    }
  </style>
</head>
