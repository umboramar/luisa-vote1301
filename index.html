  <style>

    :root {
      color-scheme: light;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      background: #ef252a;
    }

    body {
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }


    /* =========================
       ESTRUTURA
       ========================= */

    .page {
      position: relative;
      width: 100%;
      margin: 0;
    }

    .view {
      position: relative;
      width: 100%;
      margin: 0 auto;
      line-height: 0;
      overflow: hidden;
    }

    .view picture,
    .view img {
      display: block;
      width: 100%;
      height: auto;
      margin: 0;
      padding: 0;

      user-select: none;
      -webkit-user-drag: none;
    }

    .desktop-view {
      display: block;
      max-width: 1920px;
    }

    .mobile-view {
      display: none;
      max-width: 767px;
    }


    /* =========================
       NOVOS BOTÕES
       ========================= */

    .quick-links {
      position: absolute;

      top: 10px;
      right: 13px;

      z-index: 50;

      display: flex;
      align-items: center;
      justify-content: flex-end;

      gap: 4px;

      flex-wrap: wrap;

      max-width: 62%;

      line-height: normal;
    }

    .quick-links a {
      display: inline-flex;
      align-items: center;
      justify-content: center;

      min-height: 21px;

      padding: 5px 8px;

      background: rgba(255, 255, 255, 0.62);

      color: #d91f24;

      border:
        1px solid
        rgba(255, 255, 255, 0.58);

      border-radius: 999px;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      font-size: 7.7px;

      font-weight: 700;

      line-height: 1;

      letter-spacing: 0.01em;

      text-align: center;

      text-decoration: none;

      white-space: nowrap;

      cursor: pointer;

      box-shadow:
        0 1px 5px
        rgba(0, 0, 0, 0.10);

      backdrop-filter: blur(3px);

      -webkit-backdrop-filter: blur(3px);

      transition:
        background 0.15s ease,
        transform 0.15s ease;
    }

    .quick-links a:hover {
      background:
        rgba(255, 255, 255, 0.82);

      transform: translateY(-1px);
    }

    .quick-links a:focus-visible {
      outline:
        2px solid
        rgba(255, 255, 255, 0.9);

      outline-offset: 2px;
    }


    /* =========================
       HOTSPOTS
       ========================= */

    .hotspots {
      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      overflow: visible;
    }

    .hotspots a {
      pointer-events: all;

      cursor: pointer;

      outline: none;

      touch-action: manipulation;

      -webkit-tap-highlight-color:
        transparent;
    }

    .hotspots .hit {
      fill: transparent;

      stroke: transparent;

      pointer-events: all;
    }

    .hotspots a:hover .hit,
    .hotspots a:focus .hit,
    .hotspots a:focus-visible .hit,
    .hotspots a:active .hit {
      fill: transparent;

      stroke: transparent;

      outline: none;
    }


    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 767px) {

      .desktop-view {
        display: none;
      }

      .mobile-view {
        display: block;
      }

      .quick-links {
        top: 6px;

        left: 6px;
        right: 6px;

        max-width: none;

        justify-content: center;

        gap: 4px;
      }

      .quick-links a {
        min-height: 20px;

        padding: 4px 7px;

        font-size: 6.7px;

        background:
          rgba(255, 255, 255, 0.62);
      }

    }


    /* =========================
       DESKTOP
       ========================= */

    @media (min-width: 768px) {

      .desktop-view {
        display: block;
      }

      .mobile-view {
        display: none;
      }

    }

  </style>
</head>
